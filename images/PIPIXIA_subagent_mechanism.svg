<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="760" viewBox="0 0 1220 760" role="img" aria-label="Sub-Agent Collaboration">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#101828" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#B8C2D8"/>
    </marker>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#FAF5FF"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
  <rect width="1220" height="760" fill="url(#soft)"/>
  <circle cx="1130" cy="80" r="130" fill="#E9D5FF" opacity="0.35"/>
  <circle cx="90" cy="700" r="120" fill="#BAE6FD" opacity="0.28"/>
  <text x="610.0" y="48" text-anchor="middle" font-size="28" font-weight="800" fill="#172033">Sub-Agent Collaboration</text>
  <text x="610.0" y="76" text-anchor="middle" font-size="14" font-weight="500" fill="#667085">Independent child sessions with explicit run and delivery state machines</text>
<rect x="70" y="125" width="210" height="125" rx="18" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="70" y="125" width="210" height="7" rx="3.5" fill="#3B82F6"/>
<circle cx="102" cy="163" r="18" fill="#3B82F6" opacity="0.13"/>
