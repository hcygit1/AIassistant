<text x="132" y="165" text-anchor="start" font-size="17" font-weight="700" fill="#172033">Main Agent</text>
<text x="175.0" y="195" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">plans work</text>
<text x="175.0" y="213" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">calls sessions_spawn</text>
<text x="175.0" y="231" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">continues current turn</text><rect x="365" y="110" width="230" height="155" rx="18" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="365" y="110" width="230" height="7" rx="3.5" fill="#06B6D4"/>
<circle cx="397" cy="148" r="18" fill="#06B6D4" opacity="0.13"/>
<text x="397" y="154" text-anchor="middle" font-size="17" font-weight="800" fill="#06B6D4">R</text>
<text x="427" y="150" text-anchor="start" font-size="17" font-weight="700" fill="#172033">Registry</text>
<text x="480.0" y="180" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">run_id</text>
<text x="480.0" y="198" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">child_session_key</text>
<text x="480.0" y="216" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">requester_session_key</text>
<text x="480.0" y="234" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">persisted runs.json</text><rect x="690" y="125" width="215" height="125" rx="18" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="690" y="125" width="215" height="7" rx="3.5" fill="#8B5CF6"/>
<circle cx="722" cy="163" r="18" fill="#8B5CF6" opacity="0.13"/>
<text x="722" y="169" text-anchor="middle" font-size="17" font-weight="800" fill="#8B5CF6">S</text>
<text x="752" y="165" text-anchor="start" font-size="17" font-weight="700" fill="#172033">Child Session</text>
<text x="797.5" y="195" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">isolated history</text>
<text x="797.5" y="213" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">own tools</text>
<text x="797.5" y="231" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">async execution</text><rect x="980" y="125" width="180" height="125" rx="18" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="980" y="125" width="180" height="7" rx="3.5" fill="#475569"/>
<circle cx="1012" cy="163" r="18" fill="#475569" opacity="0.13"/>
<text x="1012" y="169" text-anchor="middle" font-size="17" font-weight="800" fill="#475569">UI</text>
<text x="1042" y="165" text-anchor="start" font-size="17" font-weight="700" fill="#172033">EventBus / UI</text>
<text x="1070.0" y="195" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">start/progress</text>
<text x="1070.0" y="213" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">tool events</text>
<text x="1070.0" y="231" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">done/error</text><line x1="280" y1="190" x2="365" y2="190" stroke="#B8C2D8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="595" y1="190" x2="690" y2="190" stroke="#B8C2D8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="905" y1="190" x2="980" y2="190" stroke="#B8C2D8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="100" y="385" width="260" height="145" rx="18" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="100" y="385" width="260" height="7" rx="3.5" fill="#10B981"/>
<circle cx="132" cy="423" r="18" fill="#10B981" opacity="0.13"/>
<text x="132" y="429" text-anchor="middle" font-size="17" font-weight="800" fill="#10B981">RUN</text>
<text x="162" y="425" text-anchor="start" font-size="17" font-weight="700" fill="#172033">Run State Machine</text>
<text x="230.0" y="455" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">running -&gt; succeeded</text>
<text x="230.0" y="473" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">failed / timed_out</text>
<text x="230.0" y="491" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">cancelled / orphaned</text><rect x="480" y="385" width="260" height="145" rx="18" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="480" y="385" width="260" height="7" rx="3.5" fill="#F59E0B"/>
<circle cx="512" cy="423" r="18" fill="#F59E0B" opacity="0.13"/>
<text x="512" y="429" text-anchor="middle" font-size="17" font-weight="800" fill="#F59E0B">DEL</text>
<text x="542" y="425" text-anchor="start" font-size="17" font-weight="700" fill="#172033">Result Delivery</text>
<text x="610.0" y="455" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">pending -&gt; queued</text>
<text x="610.0" y="473" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">delivering -&gt; delivered</text>
<text x="610.0" y="491" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">retrying / dropped</text><rect x="860" y="385" width="260" height="145" rx="18" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="860" y="385" width="260" height="7" rx="3.5" fill="#F43F5E"/>
<circle cx="892" cy="423" r="18" fill="#F43F5E" opacity="0.13"/>
<text x="892" y="429" text-anchor="middle" font-size="17" font-weight="800" fill="#F43F5E">REC</text>
<text x="922" y="425" text-anchor="start" font-size="17" font-weight="700" fill="#172033">Recovery &amp; Archive</text>
<text x="990.0" y="455" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">resume ended runs</text>
<text x="990.0" y="473" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">reconcile orphans</text>
<text x="990.0" y="491" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">archive old sessions</text><path d="M 475 265 C 352.5 265, 352.5 385, 230 385" fill="none" stroke="#B8C2D8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 805 250 C 707.5 250, 707.5 385, 610 385" fill="none" stroke="#B8C2D8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M 805 250 C 897.5 250, 897.5 385, 990 385" fill="none" stroke="#B8C2D8" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="235" y="640" width="750" height="62" rx="18" fill="#FFFFFF" stroke="#D8DEE9" stroke-width="1.3" filter="url(#shadow)"/>
<rect x="235" y="640" width="750" height="7" rx="3.5" fill="#06B6D4"/>
<text x="610.0" y="680" text-anchor="middle" font-size="17" font-weight="700" fill="#172033">Safety invariant</text>
<text x="610.0" y="710" text-anchor="middle" font-size="13" font-weight="400" fill="#667085">A child finishing is separate from its result being delivered; both states are tracked and persisted.</text></svg>
