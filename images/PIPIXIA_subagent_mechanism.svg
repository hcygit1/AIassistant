<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="720" viewBox="0 0 1220 720" role="img" aria-label="PIPIXIA sub-agent collaboration">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#667085"/></marker><marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#98A2B3"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1F2937}.t{font-size:26px;font-weight:700}.s{font-size:13px;fill:#667085}.h{font-size:16px;font-weight:700}.b{font-size:13px;fill:#475467}.box{fill:#fff;stroke:#98A2B3;stroke-width:1.5}.lane{fill:#F8FAFC;stroke:#D0D5DD;stroke-width:1.2}.edge{stroke:#667085;stroke-width:1.8;fill:none;marker-end:url(#a)}.dash{stroke:#98A2B3;stroke-width:1.6;stroke-dasharray:7 6;fill:none;marker-end:url(#d)}.state{fill:#F8FAFC;stroke:#98A2B3;stroke-width:1.3}</style>
<rect width="1220" height="720" fill="#fff"/><text x="610" y="42" text-anchor="middle" class="t">Sub-Agent Collaboration</text><text x="610" y="67" text-anchor="middle" class="s">Independent child sessions, persisted state, and explicit result delivery</text>
<rect x="40" y="100" width="1140" height="155" rx="4" class="lane"/><text x="60" y="128" class="h">Dispatch and execution</text>
<rect x="75" y="160" width="220" height="65" class="box"/><text x="185" y="188" text-anchor="middle" class="h">Main Agent</text><text x="185" y="208" text-anchor="middle" class="b">plan + sessions_spawn</text>
<rect x="370" y="160" width="220" height="65" class="box"/><text x="480" y="188" text-anchor="middle" class="h">Run Registry</text><text x="480" y="208" text-anchor="middle" class="b">run_id / parent / child</text>
<rect x="665" y="160" width="220" height="65" class="box"/><text x="775" y="188" text-anchor="middle" class="h">Child Session</text><text x="775" y="208" text-anchor="middle" class="b">isolated history + tools</text>
<rect x="960" y="160" width="190" height="65" class="box"/><text x="1055" y="188" text-anchor="middle" class="h">EventBus / UI</text><text x="1055" y="208" text-anchor="middle" class="b">progress / terminal</text>
<path d="M295 192H370M590 192H665M885 192H960" class="edge"/>
<rect x="40" y="305" width="1140" height="170" rx="4" class="lane"/><text x="60" y="333" class="h">Independent state machines</text>
<rect x="90" y="365" width="285" height="70" class="state"/><text x="232" y="394" text-anchor="middle" class="h">Run lifecycle</text><text x="232" y="415" text-anchor="middle" class="b">running → succeeded / failed / timed_out</text>
<rect x="468" y="365" width="285" height="70" class="state"/><text x="610" y="394" text-anchor="middle" class="h">Delivery lifecycle</text><text x="610" y="415" text-anchor="middle" class="b">pending → queued → delivered</text>
<rect x="846" y="365" width="285" height="70" class="state"/><text x="988" y="394" text-anchor="middle" class="h">Recovery lifecycle</text><text x="988" y="415" text-anchor="middle" class="b">resume → reconcile → archive</text>
<path d="M480 225V300H232V365M775 225V300H610V365M775 225V300H988V365" class="edge"/>
<path d="M375 400H468M753 400H846" class="dash"/>
<rect x="215" y="555" width="790" height="65" class="box"/><text x="610" y="584" text-anchor="middle" class="h">Safety invariant</text><text x="610" y="605" text-anchor="middle" class="b">Child completion and result delivery are separate persisted states.</text><path d="M232 435V500H410V555M610 435V555M988 435V500H810V555" class="dash"/>
</svg>
