<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-label="PIPIXIA memory pipeline">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#667085"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1F2937}.t{font-size:26px;font-weight:700}.s{font-size:13px;fill:#667085}.h{font-size:16px;font-weight:700}.b{font-size:13px;fill:#475467}.box{fill:#fff;stroke:#98A2B3;stroke-width:1.5}.edge{stroke:#667085;stroke-width:1.8;fill:none;marker-end:url(#a)}.note{fill:#F8FAFC;stroke:#D0D5DD;stroke-width:1.2}</style>
<rect width="1180" height="680" fill="#fff"/><text x="590" y="42" text-anchor="middle" class="t">Memory Pipeline</text><text x="590" y="67" text-anchor="middle" class="s">Conversation records become searchable evidence and reusable skills</text>
<rect x="55" y="120" width="200" height="115" class="box"/><text x="155" y="153" text-anchor="middle" class="h">Conversation Turn</text><text x="155" y="181" text-anchor="middle" class="b">user / assistant / tools</text><text x="155" y="202" text-anchor="middle" class="b">task boundary</text>
<rect x="310" y="120" width="220" height="115" class="box"/><text x="420" y="153" text-anchor="middle" class="h">MemWorker</text><text x="420" y="181" text-anchor="middle" class="b">summary + hash dedupe</text><text x="420" y="202" text-anchor="middle" class="b">embedding queue</text>
<rect x="585" y="120" width="220" height="115" class="box"/><text x="695" y="153" text-anchor="middle" class="h">MemStore</text><text x="695" y="181" text-anchor="middle" class="b">tasks / chunks / metadata</text><text x="695" y="202" text-anchor="middle" class="b">SQLite persistence</text>
<rect x="860" y="120" width="255" height="115" class="box"/><text x="987" y="153" text-anchor="middle" class="h">Indexes</text><text x="987" y="181" text-anchor="middle" class="b">FTS5 + sqlite-vec</text><text x="987" y="202" text-anchor="middle" class="b">keyword + semantic</text>
<path d="M255 178H310M530 178H585M805 178H860" class="edge"/>
<rect x="120" y="350" width="270" height="125" class="box"/><text x="255" y="383" text-anchor="middle" class="h">Task-first Recall</text><text x="255" y="411" text-anchor="middle" class="b">Task retrieval → Chunk expansion</text><text x="255" y="432" text-anchor="middle" class="b">orphan fallback / global ranking</text>
<rect x="455" y="350" width="270" height="125" class="box"/><text x="590" y="383" text-anchor="middle" class="h">Context Assembly</text><text x="590" y="411" text-anchor="middle" class="b">budget-aware trim</text><text x="590" y="432" text-anchor="middle" class="b">selected evidence injection</text>
<rect x="790" y="350" width="270" height="125" class="box"/><text x="925" y="383" text-anchor="middle" class="h">Offline Skill Evolution</text><text x="925" y="411" text-anchor="middle" class="b">candidate / evaluation / gate</text><text x="925" y="432" text-anchor="middle" class="b">active version only online</text>
<path d="M987 235V300H255V350M390 412H455M725 412H790" class="edge"/>
<rect x="255" y="555" width="670" height="55" class="note"/><text x="590" y="588" text-anchor="middle" class="h">Design rule: raw history stays local; prompts receive only relevant, budgeted evidence.</text><path d="M590 475V555" class="edge"/>
</svg>
