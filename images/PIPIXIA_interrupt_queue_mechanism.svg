<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="700" viewBox="0 0 1220 700" role="img" aria-label="PIPIXIA turn queue and system work">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#667085"/></marker><marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#98A2B3"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1F2937}.t{font-size:26px;font-weight:700}.s{font-size:13px;fill:#667085}.h{font-size:16px;font-weight:700}.b{font-size:13px;fill:#475467}.box{fill:#fff;stroke:#98A2B3;stroke-width:1.5}.lane{fill:#F8FAFC;stroke:#D0D5DD;stroke-width:1.2}.edge{stroke:#667085;stroke-width:1.8;fill:none;marker-end:url(#a)}.dash{stroke:#98A2B3;stroke-width:1.6;stroke-dasharray:7 6;fill:none;marker-end:url(#d)}.stop{fill:#FFF5F5;stroke:#D92D20;stroke-width:1.5}.sys{fill:#FFF8E7;stroke:#D9A441;stroke-width:1.5}</style>
<rect width="1220" height="700" fill="#fff"/><text x="610" y="42" text-anchor="middle" class="t">Turn Queue and System Work</text><text x="610" y="67" text-anchor="middle" class="s">One active user turn per session; system work waits behind the same coordinator</text>
<rect x="40" y="100" width="1140" height="150" rx="4" class="lane"/><text x="60" y="128" class="h">User turn path</text>
<rect x="70" y="160" width="210" height="65" class="box"/><text x="175" y="188" text-anchor="middle" class="h">User Message</text><text x="175" y="208" text-anchor="middle" class="b">submit + turn_id</text>
<rect x="350" y="160" width="230" height="65" class="box"/><text x="465" y="188" text-anchor="middle" class="h">Turn Coordinator</text><text x="465" y="208" text-anchor="middle" class="b">queued / running / lock</text>
<rect x="650" y="160" width="230" height="65" class="box"/><text x="765" y="188" text-anchor="middle" class="h">Session Dispatcher</text><text x="765" y="208" text-anchor="middle" class="b">priority + aging</text>
<rect x="950" y="160" width="190" height="65" class="box"/><text x="1045" y="188" text-anchor="middle" class="h">Agent Stream</text><text x="1045" y="208" text-anchor="middle" class="b">tokens / tools / done</text>
<path d="M288 192H342M588 192H642M888 192H942" class="edge"/>
<rect x="40" y="300" width="1140" height="165" rx="4" class="lane"/><text x="60" y="328" class="h">Interrupt and system work</text>
<rect x="90" y="360" width="250" height="70" class="stop"/><text x="215" y="389" text-anchor="middle" class="h">Stop / Abort</text><text x="215" y="410" text-anchor="middle" class="b">cancel run + save partial result</text>
<rect x="465" y="360" width="250" height="70" class="sys"/><text x="590" y="389" text-anchor="middle" class="h">System Work Queue</text><text x="590" y="410" text-anchor="middle" class="b">announce / heartbeat / cron</text>
<rect x="840" y="360" width="250" height="70" class="box"/><text x="965" y="389" text-anchor="middle" class="h">Recovery</text><text x="965" y="410" text-anchor="middle" class="b">restart / reconcile / retry</text>
<path d="M465 233V285H215V352M765 233V285H590V352M723 395H832" class="edge"/>
<rect x="305" y="545" width="610" height="60" class="box"/><text x="610" y="572" text-anchor="middle" class="h">Session invariant</text><text x="610" y="592" text-anchor="middle" class="b">A second user turn is rejected while the current turn is active.</text><path d="M215 438V505H610V537M965 438V505H610V537" class="dash"/>
</svg>
