<rect x="90" y="545" width="245" height="60" class="box"/><text x="212" y="570" text-anchor="middle" class="h">SQLite</text><text x="212" y="590" text-anchor="middle" class="b">FTS5 / sqlite-vec / tasks</text>
<rect x="385" y="545" width="245" height="60" class="box"/><text x="507" y="570" text-anchor="middle" class="h">Local Workspace</text><text x="507" y="590" text-anchor="middle" class="b">sessions / tool results / skills</text>
<rect x="680" y="545" width="245" height="60" class="box"/><text x="802" y="570" text-anchor="middle" class="h">Offline Evaluation</text><text x="802" y="590" text-anchor="middle" class="b">SkillLearnBench / LoCoMo</text>
<rect x="975" y="545" width="145" height="60" class="box"/><text x="1047" y="570" text-anchor="middle" class="h">Reports</text><text x="1047" y="590" text-anchor="middle" class="b">gate / release</text>
