<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="PIPIXIA system architecture">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#667085"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1F2937}.t{font-size:26px;font-weight:700}.s{font-size:13px;fill:#667085}.h{font-size:16px;font-weight:700}.b{font-size:13px;fill:#475467}.box{fill:#fff;stroke:#98A2B3;stroke-width:1.5}.lane{fill:#F8FAFC;stroke:#D0D5DD;stroke-width:1.2}.edge{stroke:#667085;stroke-width:1.8;fill:none;marker-end:url(#a)}</style>
<rect width="1200" height="720" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="t">PIPIXIA System Architecture</text><text x="600" y="67" text-anchor="middle" class="s">Local-first Agent runtime, persistent memory, tools, and evaluation</text>
<rect x="40" y="100" width="1120" height="140" rx="4" class="lane"/><text x="60" y="128" class="h">Interaction</text>
<rect x="70" y="150" width="190" height="65" class="box"/><text x="165" y="178" text-anchor="middle" class="h">Web UI</text><text x="165" y="198" text-anchor="middle" class="b">Next.js / React / SSE</text>
<rect x="330" y="150" width="190" height="65" class="box"/><text x="425" y="178" text-anchor="middle" class="h">FastAPI</text><text x="425" y="198" text-anchor="middle" class="b">REST routes / sessions</text>
<rect x="590" y="150" width="220" height="65" class="box"/><text x="700" y="178" text-anchor="middle" class="h">Agent Runtime</text><text x="700" y="198" text-anchor="middle" class="b">LangGraph ReAct / context</text>
<rect x="880" y="150" width="240" height="65" class="box"/><text x="1000" y="178" text-anchor="middle" class="h">LLM Gateway</text><text x="1000" y="198" text-anchor="middle" class="b">model selection / retry</text>
<path d="M260 182H330M520 182H590M810 182H880" class="edge"/>
<rect x="40" y="280" width="1120" height="170" rx="4" class="lane"/><text x="60" y="308" class="h">Runtime Services</text>
<rect x="70" y="335" width="220" height="75" class="box"/><text x="180" y="364" text-anchor="middle" class="h">Tools + Sandbox</text><text x="180" y="386" text-anchor="middle" class="b">fs / exec / web / approval</text>
<rect x="335" y="335" width="220" height="75" class="box"/><text x="445" y="364" text-anchor="middle" class="h">Memory</text><text x="445" y="386" text-anchor="middle" class="b">Task-first recall / skills</text>
<rect x="600" y="335" width="220" height="75" class="box"/><text x="710" y="364" text-anchor="middle" class="h">Sub-Agents</text><text x="710" y="386" text-anchor="middle" class="b">run / delivery / recovery</text>
<rect x="865" y="335" width="255" height="75" class="box"/><text x="992" y="364" text-anchor="middle" class="h">Scheduler + Events</text><text x="992" y="386" text-anchor="middle" class="b">heartbeat / cron / audit</text>
<path d="M700 215V275H180V335M700 275H445V335M700 275H710V335M700 275H992V335" class="edge"/>
